name: CI

# Guarded per spec 10 decision Q6: inert while the canonical repo lives on
# self-hosted Gitea; activates unchanged when the repo moves to
# github.com/caseyrobb/kubedroid.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test-assemble:
    if: github.repository == 'caseyrobb/kubedroid'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + lint + debug assemble
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
